<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Tela 2">
<link rel="apple-touch-icon" href="/icone.png">
<title>Tela 2</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  #tela { display: block;
          -webkit-user-select: none; -webkit-touch-callout: none; }
  /* Camada fixa que recebe os toques: a imagem e trocada a cada quadro, e no iOS
     o toque se perde se o elemento tocado sai da pagina no meio do gesto. */
  #toque { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 1;
           -webkit-tap-highlight-color: rgba(0, 0, 0, 0); }
  /* Botao do teclado e o campo escondido que faz o teclado do iOS aparecer. */
  #btn-teclado { position: fixed; right: 12px; bottom: 12px; z-index: 3; margin: 0;
                 padding: 10px 14px; border: 0; border-radius: 0; background: rgba(20, 20, 22, 0.75);
                 color: #ffb020; font: 600 16px -apple-system, Helvetica, Arial, sans-serif;
                 -webkit-appearance: none; -webkit-tap-highlight-color: rgba(0, 0, 0, 0); }
  #btn-teclado.aberto { background: #ffb020; color: #1a1204; top: 12px; bottom: auto; }
  #campo { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0;
           border: 0; padding: 0; font-size: 16px; z-index: 0; }
  #aviso { position: fixed; left: 0; right: 0; bottom: 0; display: none; z-index: 2;
           padding: 12px 16px; background: rgba(0, 0, 0, 0.8); color: #e6e6e6;
           font: 15px -apple-system, Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<img id="tela" alt="">
<div id="toque"></div>
<input id="campo" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-hidden="true">
<button id="btn-teclado" type="button">Teclado</button>
<div id="aviso"></div>
<script>
/* JavaScript antigo (ES5) de proposito: o Safari do iOS 9 nao entende sintaxe moderna. */
(function () {
  var tela = document.getElementById('tela');
  var aviso = document.getElementById('aviso');
  var camada = document.getElementById('toque');
  var falhas = 0;
  var tecladoAberto = false;
  var ultimoToqueY = 0.5; /* posicao vertical (0 a 1) do ultimo toque na imagem */
  /* Chave de acesso: vem da URL (?chave=...) e vai em todos os pedidos ao PC. */
  var achou = /[?&]chave=([^&#]*)/.exec(location.search);
  var chave = achou ? achou[1] : '';

  function mostrarAviso(texto) {
    aviso.innerHTML = texto;
    aviso.style.display = texto ? 'block' : 'none';
  }

  var AVISO_SEM_CHAVE = 'Falta a chave de acesso. Abra o endere&ccedil;o completo, com <b>?chave=</b>, ' +
                        'que aparece na janela do servidor no PC.';
  var AVISO_CHAVE_ERRADA = 'Chave de acesso errada. Confira o endere&ccedil;o na janela do servidor no PC ' +
                           'e, se mudou, recrie o &iacute;cone na Tela de In&iacute;cio.';
  var AVISO_SEM_CONEXAO = 'Sem conex&atilde;o com o PC. Tentando de novo...';

  /* Quando uma imagem falha, pergunta ao servidor se o problema e a chave (403) ou a conexao.
     A acao "verificar" nao clica em nada. */
  function explicarFalha() {
    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status === 403) {
          mostrarAviso(AVISO_CHAVE_ERRADA);
        } else if (xhr.status === 429) {
          mostrarAviso('Muitas tentativas com chave errada. Espere alguns minutos e confira o endere&ccedil;o.');
        } else {
          mostrarAviso(AVISO_SEM_CONEXAO);
        }
      }
    };
    xhr.open('GET', '/toque?chave=' + chave + '&a=verificar&x=0&y=0&t=' + new Date().getTime(), true);
    xhr.send();
  }

  /* Encaixa a imagem inteira na area visivel, sem cortar e sem distorcer
     (o Safari do iOS 9 nao tem object-fit). */
  /* Altura da janela sem o teclado. O iOS 9 encolhe a janela quando o teclado abre;
     a imagem continua no tamanho de antes (senao ela diminui) e so e deslocada. */
  var alturaSemTeclado = window.innerHeight;

  function encaixar(img) {
    var w = window.innerWidth, h = window.innerHeight;
    var iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    if (!iw || !ih || !w || !h) { return; }
    if (!tecladoAberto) { alturaSemTeclado = h; }
    var hCheia = tecladoAberto ? alturaSemTeclado : h;
    var escala = Math.min(w / iw, hCheia / ih);
    var lw = Math.floor(iw * escala), lh = Math.floor(ih * escala);
    img.style.width = lw + 'px';
    img.style.height = lh + 'px';
    img.style.marginLeft = Math.floor((w - lw) / 2) + 'px';
    img.style.marginTop = Math.floor((hCheia - lh) / 2) + 'px';
    if (tecladoAberto) {
      /* O teclado cobre a parte de baixo. Desloca a imagem para que o ponto do ultimo toque
         (a caixa de texto) fique no meio da area que sobra visivel acima do teclado. */
      var visivel = areaVisivel(h, w);
      var topo = Math.round(visivel / 2 - ultimoToqueY * lh);
      topo = Math.max(Math.min(topo, 0), visivel - lh);
      img.style.marginTop = topo + 'px';
    }
  }

  /* Altura que sobra acima do teclado. Se o iOS ja encolheu a janela, essa e a medida real;
     se nao encolheu, usa uma estimativa do teclado do iPad (medida no iPad 3). */
  function areaVisivel(h, w) {
    if (h < alturaSemTeclado - 100) { return h; }
    var paisagem = w > alturaSemTeclado;
    return Math.round(alturaSemTeclado * (paisagem ? 0.46 : 0.68));
  }
  window.onresize = function () { encaixar(tela); };
  window.onorientationchange = window.onresize;

  /* Toque: tocar = clique, arrastar o dedo = arrastar, segurar = botao direito.
     Envia um pedido por vez; movimentos seguidos viram um so, para nao entupir o Wi-Fi. */
  var fila = [], enviando = false;

  function enviarToque(acao, x, y) {
    var ultimo = fila[fila.length - 1];
    if (acao === 'mover' && ultimo && ultimo.a === 'mover') {
      ultimo.x = x; ultimo.y = y;
    } else {
      fila.push({ a: acao, x: x, y: y });
    }
    proximoToque();
  }

  /* Teclas vao na mesma fila dos toques, para chegarem ao PC na ordem certa.
     Texto seguido vira um pedido so (ate 200 caracteres). */
  function enviarTexto(texto) {
    var ultimo = fila[fila.length - 1];
    if (ultimo && ultimo.texto !== undefined && (ultimo.texto + texto).length <= 200) {
      ultimo.texto += texto;
    } else {
      fila.push({ texto: texto });
    }
    proximoToque();
  }

  function enviarTecla(nome) {
    fila.push({ tecla: nome });
    proximoToque();
  }

  var timerAvisoTecla = null;
  function avisarTecla() {
    mostrarAviso('Para digitar, toque antes numa janela que esteja na tela do iPad.');
    clearTimeout(timerAvisoTecla);
    timerAvisoTecla = setTimeout(function () { mostrarAviso(''); }, 3000);
  }

  function proximoToque() {
    if (enviando || !fila.length) { return; }
    var t = fila.shift();
    var url;
    if (t.texto !== undefined) {
      url = '/tecla?chave=' + chave + '&t=' + encodeURIComponent(t.texto);
    } else if (t.tecla) {
      url = '/tecla?chave=' + chave + '&k=' + t.tecla;
    } else {
      url = '/toque?chave=' + chave + '&a=' + t.a + '&x=' + t.x.toFixed(4) + '&y=' + t.y.toFixed(4);
    }
    var xhr = new XMLHttpRequest();
    enviando = true;
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        enviando = false;
        if (xhr.status === 409 && (t.texto !== undefined || t.tecla)) { avisarTecla(); }
        proximoToque();
      }
    };
    xhr.open('GET', url + '&n=' + new Date().getTime(), true);
    xhr.send();
  }

  /* Teclado: o botao foca um campo escondido, o que abre o teclado do iOS.
     O campo guarda sempre dois espacos ("sentinela"): se o valor encurta, foi o apagar;
     se cresce, o que passou da sentinela e texto novo. Depois volta a ter so a sentinela. */
  var campo = document.getElementById('campo');
  var botaoTeclado = document.getElementById('btn-teclado');
  var SENTINELA = '  ';

  function reiniciarCampo() {
    campo.value = SENTINELA;
    try { campo.setSelectionRange(SENTINELA.length, SENTINELA.length); } catch (e) {}
  }

  function alternarTeclado(e) {
    if (e) { e.preventDefault(); }
    if (tecladoAberto) {
      campo.blur();
    } else {
      reiniciarCampo();
      campo.focus();
    }
  }
  botaoTeclado.addEventListener('touchend', alternarTeclado, false);
  botaoTeclado.addEventListener('click', alternarTeclado, false);

  /* O Safari rola a pagina para mostrar o campo focado; isso empurrava a imagem para fora. */
  function voltarAoTopo() {
    if (window.pageYOffset || document.body.scrollTop) { window.scrollTo(0, 0); }
    encaixar(tela);
  }
  window.addEventListener('scroll', function () {
    if (window.pageYOffset || document.body.scrollTop) { window.scrollTo(0, 0); }
  }, false);

  campo.addEventListener('focus', function () {
    tecladoAberto = true;
    botaoTeclado.className = 'aberto';
    voltarAoTopo();
    setTimeout(voltarAoTopo, 100);
    setTimeout(voltarAoTopo, 400);
  }, false);
  campo.addEventListener('blur', function () {
    tecladoAberto = false;
    botaoTeclado.className = '';
    voltarAoTopo();
    setTimeout(voltarAoTopo, 300);
  }, false);

  campo.addEventListener('keydown', function (e) {
    var c = e.keyCode;
    if (c === 13) { e.preventDefault(); enviarTecla('enter'); }
    else if (c === 9) { e.preventDefault(); enviarTecla('tab'); }
    else if (c === 27) { e.preventDefault(); enviarTecla('esc'); }
    else if (c >= 37 && c <= 40) {
      e.preventDefault();
      enviarTecla(['esquerda', 'cima', 'direita', 'baixo'][c - 37]);
    }
  }, false);

  campo.addEventListener('input', function () {
    var v = campo.value, i;
    if (v.length < SENTINELA.length) {
      for (i = v.length; i < SENTINELA.length; i++) { enviarTecla('apagar'); }
    } else if (v.indexOf(SENTINELA) === 0) {
      if (v.length > SENTINELA.length) { enviarTexto(v.slice(SENTINELA.length)); }
    } else if (v.replace(/^\s+/, '')) {
      enviarTexto(v.replace(/^\s+/, ''));
    }
    reiniciarCampo();
  }, false);

  function posicao(e) {
    var d = (e.changedTouches && e.changedTouches.length ? e.changedTouches : e.touches)[0];
    var r = tela.getBoundingClientRect();
    return { x: (d.clientX - r.left) / r.width, y: (d.clientY - r.top) / r.height,
             cx: d.clientX, cy: d.clientY };
  }

  var inicio = null, arrastando = false, segurou = false, timerSegurar = null;

  camada.addEventListener('touchstart', function (e) {
    e.preventDefault();
    if (e.touches.length > 1) { return; }
    inicio = posicao(e);
    ultimoToqueY = Math.min(Math.max(inicio.y, 0), 1);
    arrastando = false;
    segurou = false;
    enviarToque('mover', inicio.x, inicio.y);
    timerSegurar = setTimeout(function () {
      segurou = true;
      enviarToque('direito', inicio.x, inicio.y);
    }, 600);
  }, false);

  camada.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!inicio || segurou) { return; }
    var p = posicao(e);
    if (!arrastando) {
      if (Math.abs(p.cx - inicio.cx) < 10 && Math.abs(p.cy - inicio.cy) < 10) { return; }
      clearTimeout(timerSegurar);
      arrastando = true;
      enviarToque('baixo', inicio.x, inicio.y);
    }
    enviarToque('mover', p.x, p.y);
  }, false);

  function fimToque(e) {
    e.preventDefault();
    clearTimeout(timerSegurar);
    if (!inicio) { return; }
    var p = posicao(e);
    if (arrastando) {
      enviarToque('cima', p.x, p.y);
    } else if (!segurou) {
      enviarToque('clique', inicio.x, inicio.y);
    }
    inicio = null;
  }
  camada.addEventListener('touchend', fimToque, false);
  camada.addEventListener('touchcancel', fimToque, false);

  if (!chave) {
    mostrarAviso(AVISO_SEM_CHAVE);
    return;
  }

  /* Modo stream continuo (MJPEG): abrir com ?chave=...&modo=mjpeg */
  if (/modo=mjpeg/.test(location.search)) {
    tela.onerror = function () {
      explicarFalha();
      setTimeout(function () { tela.src = '/stream.mjpg?chave=' + chave + '&t=' + new Date().getTime(); }, 2000);
    };
    tela.onload = function () { encaixar(tela); mostrarAviso(''); };
    tela.src = '/stream.mjpg?chave=' + chave + '&t=' + new Date().getTime();
    return;
  }

  /* Modo padrao: pede um quadro por vez e troca a imagem quando o novo chega. */
  function proximo() {
    var img = new Image();
    img.onload = function () {
      img.id = 'tela';
      encaixar(img);
      tela.parentNode.replaceChild(img, tela);
      tela = img;
      falhas = 0;
      mostrarAviso('');
      proximo();
    };
    img.onerror = function () {
      falhas++;
      explicarFalha();
      setTimeout(proximo, Math.min(falhas * 500, 3000));
    };
    img.src = '/frame.jpg?chave=' + chave + '&t=' + new Date().getTime();
  }

  proximo();
})();
</script>
</body>
</html>
